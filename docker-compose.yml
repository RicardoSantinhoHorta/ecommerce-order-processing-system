
services:

  order-service:
    build: ./order-service
    ports:
      - "8080:8080"
    depends_on: #O order estava a arrancar mais cedo que o mysql então não o encontrava.
      mysql:
        condition: service_healthy

  #payment-service: build: ./payment-service  ports: - "8081:8080"

  #inventory-service: build: ./inventory-service  ports: - "8082:8080"

  mysql:
    image: mysql:8.4 #Imagem oficial
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: order_db
      MYSQL_USER: "ecom"
      MYSQL_PASSWORD: "123"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck: # Para deixar o mysql pronto
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: